name: zukkor
description: "Zukkor — bilim musobaqasi. Real-time multiplayer quiz o'yini."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management — qo'lda yozilgan Riverpod provider'lar (kod-gen'siz).
  flutter_riverpod: ^3.0.3

  # Navigation
  go_router: ^16.3.0

  # Networking
  dio: ^5.9.0
  web_socket_channel: ^3.0.2

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8
  tabler_icons_plus: ^3.44.0

  # Avatar photo upload — gallery/camera picker.
  image_picker: ^1.1.2

  # AI orqali quiz yaratish — hujjat (PDF/Word/matn) tanlash uchun.
  file_picker: ^8.1.7

  # Google Sign-In
  google_sign_in: ^7.1.1

  # Firebase — Google Sign-In backend tekshiruvi + push notification (FCM)
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  firebase_messaging: ^16.4.3
  firebase_analytics: ^12.4.5

  # UI sound effects
  audioplayers: ^6.5.1

  # Skeleton loading placeholders
  shimmer: ^3.0.0

  # Localization (English/Uzbek/Russian) — lib/i18n/*.i18n.json, generated
  # via `dart run slang` (no build_runner needed).
  slang: ^4.7.3
  slang_flutter: ^4.7.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Ilova belgisini (launcher icon) bitta manba rasmdan Android/iOS uchun
  # kerakli barcha o'lchamlarda generatsiya qiladi — `dart run
  # flutter_launcher_icons` orqali ishga tushiriladi, konfiguratsiya
  # pastdagi `flutter_launcher_icons:` bo'limida.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/branding/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# `dart run flutter_launcher_icons` shu konfiguratsiyadan Android/iOS
# uchun barcha kerakli o'lchamlarni generatsiya qiladi. Manba —
# assets/icon/zukkor_launcher_icon.png (1024px, dizayner tomonidan
# to'g'ridan-to'g'ri shu o'lchamda eksport qilingan — kattalashtirish yo'q,
# App Store'ning 1024px talabi uchun ham xiralik xavfsiz).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/zukkor_launcher_icon.png"
  remove_alpha_ios: true
  # Without these, Android (8+) synthesizes its own adaptive icon from the
  # flat square/circle source above — it shrinks it and pads it onto a
  # white card, which is why the icon showed up with an unwanted white
  # border on-device. Providing the real background/foreground layers
  # (dark fill + the Z-mark alone, transparent elsewhere) makes Android
  # composite it correctly, filling the full adaptive shape edge-to-edge.
  adaptive_icon_background: "#1E140F"
  adaptive_icon_foreground: "assets/icon/zukkor_adaptive_foreground.png"
