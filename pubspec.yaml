name: zukkor
description: "Zukkor — bilim musobaqasi. Real-time multiplayer quiz o'yini."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management — qo'lda yozilgan Riverpod provider'lar (kod-gen'siz).
  flutter_riverpod: ^3.0.3

  # Navigation
  go_router: ^16.3.0

  # Networking
  dio: ^5.9.0
  web_socket_channel: ^3.0.2

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8
  tabler_icons_plus: ^3.44.0

  # Avatar photo upload — gallery/camera picker.
  image_picker: ^1.1.2

  # UI sound effects
  audioplayers: ^6.5.1

  # Localization (English/Uzbek/Russian) — lib/i18n/*.i18n.json, generated
  # via `dart run slang` (no build_runner needed).
  slang: ^4.7.3
  slang_flutter: ^4.7.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
